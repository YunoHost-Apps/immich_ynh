#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "immich"
name = "Immich"
description.en = "Photo and video backup solution directly from your mobile phone"
description.fr = "Sauvegarde de photos et de vidéos directement depuis votre mobile"

version = "3.4.1~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://immich.app"
demo = "https://demo.immich.app"
admindoc = "https://github.com/immich-app/immich#getting-started"
userdoc = "https://github.com/immich-app/immich#getting-started"
code = "https://github.com/immich-app/immich"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "3G"
ram.build = "2G"
ram.runtime = "2G"

[install]
	[install.domain]
	type = "domain"

	[install.init_main_permission]
	help.en = "You must activate 'Visitors' if you want to connect the Immich mobile app to your Immich server. This can be changed later via the webadmin."
	type = "group"
	default = "visitors"

[resources]
	[resources.sources]

	[resources.sources.immich_prebuilt_bookworm]
	amd64.url = "https://github.com/YunoHost-Apps/immich-build/releases/download/immich-v3.4.1/immich-v3.4.1-bookworm-amd64.tar.gz"
	amd64.sha256 = "3470b1e824e8aa6ea1778ca0189bb9f2d3123f53372aa9c9dce4c113ad069091"
	arm64.url = "https://github.com/YunoHost-Apps/immich-build/releases/download/immich-v3.4.1/immich-v3.4.1-bookworm-arm64.tar.gz"
	arm64.sha256 = "bff866e28eeb0c707d287fd78c7f76bacdd032a82b5889eba16331df50dba0ad"

	prefetch = false

	[resources.sources.immich_prebuilt_trixie]
	amd64.url = "https://github.com/YunoHost-Apps/immich-build/releases/download/immich-v3.4.1/immich-v3.4.1-trixie-amd64.tar.gz"
	amd64.sha256 = "d56a2fd512db9299c4715fb30dec6f1ae55036da229b779d59d42b1405134de9"
	arm64.url = "https://github.com/YunoHost-Apps/immich-build/releases/download/immich-v3.4.1/immich-v3.4.1-trixie-arm64.tar.gz"
	arm64.sha256 = "2853ef2d733bf910bc5fd41f18433a115e010e7a88613bb5149da7e1a610ca91"

	prefetch = false

	[resources.sources.vchord]
	# Version https://github.com/immich-app/base-images/blob/main/postgres/versions.yaml#L9
	# and https://github.com/immich-app/immich/blob/main/server/src/constants.ts#L24
	amd64.url = "https://github.com/tensorchord/VectorChord/releases/download/1.1.1/postgresql-17-vchord_1.1.1-1_amd64.deb"
	amd64.sha256 = "a48132c8d616c0d52a9811b32f12f88a8f6cc8542d7cc0180c8d0986bfbd03c5"
	arm64.url = "https://github.com/tensorchord/VectorChord/releases/download/1.1.1/postgresql-17-vchord_1.1.1-1_arm64.deb"
	arm64.sha256 = "50ae776bb2376f2b21aea646984cef51e96cc8ae49626cceccb043432c3ba1aa"

	format = "whatever"
	extract = false
	rename = "postgresql-17-vchord.deb"
	prefetch = true

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	api.url = "/api"
	api.allowed = "visitors"
	api.show_tile = false
	api.protected = true

	[resources.ports]
	main.default = 2283
	machinelearning.default = 3003

	[resources.apt]
	packages = [
		"postgresql",
		"redis-server",
		"uuid-runtime",
		"curl",
		"unzip",
		"pigz"
		"libgl1",
		"libglib2.0-0",
		"libexpat1",
		"libexif12",
		"libgif7",
		"libjpeg62-turbo",
		"libpng16-16",
		"libwebp7",
		"libtiff6",
		"libcgif0",
		"liblcms2-2",
		"libaom3",
		"libde265-0",
		"libimagequant0",
		"libwebpdemux2"
	]
	packages_from_raw_bash = """
	if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
		echo "libdav1d7, libraw23t64, postgresql-17-pgvector";
	elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
		echo "libdav1d6, libraw20";
	fi
	"""

	[resources.apt.extras.jellyfin-ffmpeg]
	# Version https://github.com/immich-app/immich/blob/main/mise.toml#L31
	repo = "deb https://repo.jellyfin.org/debian __YNH_DEBIAN_VERSION__ main"
	key = "https://repo.jellyfin.org/jellyfin_team.gpg.key"
	packages = [
		"jellyfin-ffmpeg7"
	]

	[resources.database]
	type = "postgresql"

	[resources.nodejs]
	version = "24.22.1"
